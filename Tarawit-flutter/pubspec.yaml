name: tarawit_mobile
description: Mobile frontend for the Tara Wit school management system.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  go_router: ^14.8.1
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  config:
    enable-lldb-debugging: false
  uses-material-design: true
  assets:
    - assets/images/logo_tara.webp
